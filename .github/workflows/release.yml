# Started by the check workflow with the Last-Modified dates it found unreleased: download and patch, validate raw and
# patched with the MobilityData validator, and publish a GitHub release tagged with both dates. To run it by hand, run
# the check workflow, which reads the dates and starts this one.
name: Release patched GTFS

on:
  workflow_dispatch:
    inputs:
      gtfs_last_modified:
        description: Last-Modified of the SNCF GTFS export, as served
        required: true
      idh_last_modified:
        description: Last-Modified of the IDH transfer rules export, as served
        required: true

permissions:
  contents: write

# one release run at a time: a second dispatch waits for the first
concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Download and patch
        id: patch
        run: |
          ./gradlew run -q --args="--no-txt"
          # the app downloads both files itself and writes the Last-Modified of each in a .version file next to it: make sure they are the versions the check saw
          test "$(cat download/sncf.zip.version)" = "${{ inputs.gtfs_last_modified }}" -a "$(cat download/sncf_transfer_rules.zip.version)" = "${{ inputs.idh_last_modified }}"
          echo "tag=$(date -u -d "${{ inputs.gtfs_last_modified }}" +%Y-%m-%dT%H-%M-%SZ)_$(date -u -d "${{ inputs.idh_last_modified }}" +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=$(unzip -p download/sncf.zip feed_info.txt | tail -n +2 | cut -d, -f7)" >> "$GITHUB_OUTPUT"

      - name: Validate raw and patched feeds
        id: validate
        run: |
          gh release download -R MobilityData/gtfs-validator -p '*-cli.jar' -O validator.jar
          validate() { java --sun-misc-unsafe-memory-access=allow -Djava.util.logging.config.file=.github/validator-logging.properties -jar validator.jar -c FR -i "$1" -o "$2"; }
          validate download/sncf.zip validation/raw
          validate output/sncf_patched.zip validation/patched
          # the validator exits 0 even with errors, so count them in the report.
          # point_near_origin is the CITY_ stops at (0,0), which MOTIS requires
          raw=$(jq '[.notices[] | select(.severity == "ERROR")] | length' validation/raw/report.json)
          patched=$(jq '[.notices[] | select(.severity == "ERROR" and .code != "point_near_origin")] | length' validation/patched/report.json)
          echo "errors: raw $raw, patched $patched"
          test "$raw" -eq 0 -a "$patched" -eq 0
          mv validation/raw/report.html validation/validation_raw.html
          mv validation/patched/report.html validation/validation_patched.html

      - name: Release
        id: release
        run: |
          gh release create "${{ steps.patch.outputs.tag }}" \
            output/sncf_patched.zip output/sncf_patched_without_transfers.zip data/sncf_display_name_fix.lua validation/validation_raw.html validation/validation_patched.html \
            --title "SNCF GTFS ${{ steps.patch.outputs.version }}" \
            --notes "Patched SNCF GTFS, feed_version ${{ steps.patch.outputs.version }}. GTFS published ${{ inputs.gtfs_last_modified }}, IDH transfer rules published ${{ inputs.idh_last_modified }}. MobilityData validation reports attached, raw and patched."
