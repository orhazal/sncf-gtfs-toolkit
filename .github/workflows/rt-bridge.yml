# On every push to master touching the bridge or the build: test, build the rt-bridge image and push it to
# ghcr.io/orhazal/sncf-gtfs-toolkit/rt-bridge, tagged latest and with the commit sha.
name: rt-bridge image

on:
  push:
    branches: [master]
    paths:
      - rt-bridge/**
      - gradle/**
      - gradlew
      - settings.gradle.kts
      - build.gradle.kts
      - .github/workflows/rt-bridge.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: rt-bridge/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/rt-bridge:latest
            ghcr.io/${{ github.repository }}/rt-bridge:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
