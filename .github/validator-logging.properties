# java.util.logging config for the MobilityData validator in the release workflow: the reports carry the results,
# so only warnings go to the console, and not the runner's "validators skipped because the data is absent" table
.level=WARNING
handlers=java.util.logging.ConsoleHandler
java.util.logging.ConsoleHandler.level=WARNING
org.mobilitydata.gtfsvalidator.runner.ValidationRunner.level=SEVERE
